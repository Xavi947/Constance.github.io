<!DOCTYPE html>
<html>
<head>
<title>For Constance ❤️</title>
<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffb6d9, #ffd6a5);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.card {
    background: white;
    width: 90%;
    max-width: 450px;
    padding: 30px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.2);
}

h1 {
    color: #ff4f81;
}

p {
    font-size: 18px;
    color: #444;
}

button {
    padding: 15px 25px;
    border: none;
    border-radius: 30px;
    font-size: 17px;
    cursor: pointer;
    margin: 10px;
}

#yes {
    background: #ff4f81;
    color: white;
}

#no {
    background: #ddd;
    position: absolute;
}

.heart {
    font-size: 50px;
}
</style>
</head>

<body>

<div class="card">
    <div class="heart">❤️</div>

    <h1>Hey Constance...</h1>

    <p>
    I know we had our moments (and yes, I probably annoyed you sometimes 😂),
    but I was thinking...
    </p>

    <p>
    What if we gave us another chance?
    <br><br>
    I promise to bring more laughs, more memories, and slightly less nonsense...
    (no guarantees though 😌)
    </p>

    <h2>Should we rekindle this?</h2>

    <button id="yes" onclick="yesClick()">Okay, let's try again ❤️</button>
    <button id="no" onmouseover="moveNo()">No 😭</button>

</div>

<script>

function yesClick(){
    document.querySelector(".card").innerHTML = `
    <div class="heart">🥰</div>
    <h1>Best decision ever, Constance ❤️</h1>
    <p>
    Congratulations, you have officially agreed to tolerate my jokes again 😂
    <br><br>
    I promise to make this chapter better than the last one.
    </p>
    `;
}

function moveNo(){
    let button = document.getElementById("no");

    let x = Math.random() * (window.innerWidth - 120);
    let y = Math.random() * (window.innerHeight - 80);

    button.style.left = x + "px";
    button.style.top = y + "px";
}

</script>

</body>
</html>
