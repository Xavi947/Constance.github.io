<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ff5c8a">
<title>For Constance ❤️</title>
<style>
:root{
  --pink:#ff5c8a;
  --pink2:#ff8fb0;
  --rose:#fff0f5;
  --cream:#fffaf7;
  --ink:#28232a;
  --muted:#756b74;
  --card:rgba(255,255,255,.92);
  --shadow:0 20px 60px rgba(116,45,73,.16);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body{
  min-height:100vh;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 10% 10%, #ffd6e3 0, transparent 32%),
    radial-gradient(circle at 90% 90%, #ffe3cf 0, transparent 34%),
    linear-gradient(145deg,#fff7fa,#fffaf5);
}
button{font:inherit}
#app{min-height:100vh;position:relative}
.bg-heart{
  position:fixed;bottom:-40px;left:var(--x);font-size:var(--s);
  opacity:.18;animation:floatUp var(--d) linear infinite;pointer-events:none;z-index:0
}
@keyframes floatUp{
  from{transform:translateY(0) rotate(0deg);opacity:0}
  12%{opacity:.18}
  90%{opacity:.14}
  to{transform:translateY(-115vh) rotate(22deg);opacity:0}
}
.screen{
  min-height:100vh;display:none;align-items:center;justify-content:center;
  padding:28px 18px 36px;position:relative;z-index:1
}
.screen.active{display:flex;animation:screenIn .45s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
.card{
  width:min(100%,560px);background:var(--card);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.8);border-radius:30px;padding:30px 20px;
  box-shadow:var(--shadow);text-align:center
}
.eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--pink);font-weight:800;margin-bottom:10px}
h1{font-size:clamp(2.1rem,9vw,4.3rem);line-height:1.02;margin:8px 0 18px;letter-spacing:-.05em}
h2{font-size:clamp(1.65rem,7vw,2.5rem);line-height:1.05;margin:8px 0 18px;letter-spacing:-.035em}
p{font-size:1.06rem;line-height:1.65;color:var(--muted);margin:12px 0}
.small{font-size:.9rem}
.highlight{color:var(--pink);font-weight:800}
.emoji{font-size:3.5rem;display:block;margin-bottom:12px;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(2deg)}}
.btns{display:grid;gap:12px;margin-top:24px}
.btn{
  width:100%;min-height:54px;border:0;border-radius:18px;padding:14px 18px;
  font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .15s,filter .15s;
  -webkit-tap-highlight-color:transparent
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--pink),#ff7aa0);color:white;box-shadow:0 12px 25px rgba(255,92,138,.28)}
.btn.secondary{background:#fff;border:2px solid #ffd1de;color:#7b4558}
.btn.dark{background:#2d2730;color:#fff}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid #eee}
.legal{
  text-align:left;background:#fffdfb;border:1px dashed #efb5c7;border-radius:20px;
  padding:18px;margin-top:18px
}
.clause{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f5e7ec;line-height:1.5}
.clause:last-child{border-bottom:0}
.check{color:#e64d7c;font-weight:900}
.choice{display:grid;gap:12px;margin-top:24px}
.choice .btn{min-height:62px}
.evidence{
  text-align:left;display:grid;gap:12px;margin-top:20px
}
.evidence-item{
  background:#fff;border-radius:18px;padding:15px 16px;box-shadow:0 8px 25px rgba(100,60,80,.07);
  border:1px solid #f5e7ec
}
.progress{display:flex;gap:6px;justify-content:center;margin-bottom:22px}
.dot{width:8px;height:8px;border-radius:50%;background:#eadde3}
.dot.on{background:var(--pink);width:22px;border-radius:10px}
.fake-loader{margin:22px auto;width:180px;height:10px;background:#f4dfe6;border-radius:99px;overflow:hidden}
.fake-loader span{display:block;height:100%;width:0;background:var(--pink);animation:load 2.3s ease forwards}
@keyframes load{to{width:100%}}
.result{
  background:#fff3f7;border-radius:22px;padding:18px;margin-top:18px;font-weight:700;color:#754355
}
#toast{
  position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);
  background:#2d2730;color:white;padding:12px 18px;border-radius:14px;
  opacity:0;pointer-events:none;transition:.25s;z-index:50;font-size:.9rem;
  width:min(90%,380px);text-align:center
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;top:-20px;z-index:30;pointer-events:none;animation:confettiFall var(--fall) linear forwards}
@keyframes confettiFall{to{transform:translate3d(var(--dx),110vh,0) rotate(720deg);opacity:0}}
.signature{margin-top:22px;color:#8b6572;font-weight:700}
.footer-note{margin-top:18px;font-size:.78rem;color:#a2959c}
@media (min-width:600px){
  .screen{padding:50px 24px}
  .card{padding:42px 36px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
/*
  ============================
  IMPORTANT: FORM NOTIFICATIONS
  ============================
  1. Create a free Formspree form.
  2. Copy its endpoint, e.g. https://formspree.io/f/xxxxxabc
  3. Paste it below between the quotes.
  Until you do that, the website still works, but choices are NOT emailed.
*/
const FORMSPREE_ENDPOINT = "PASTE_YOUR_FORMSPREE_ENDPOINT_HERE";

const app = document.getElementById("app");
const toast = document.getElementById("toast");

const screens = [
  {id:"welcome", title:"For Constance ❤️"},
  {id:"talk", title:"We need to talk…"},
  {id:"contract", title:"The Official Contract™"},
  {id:"jokes", title:"Okay, jokes aside…"},
  {id:"proposal", title:"The Proposal"},
  {id:"convince", title:"Fair enough 😏"},
  {id:"evidence", title:"The Evidence"},
  {id:"offer", title:"THE FINAL OFFER™"},
  {id:"negotiate", title:"Hostile Takeover"},
  {id:"no", title:"Absolutely not 😂"},
  {id:"yes", title:"Deal, Constance ❤️"}
];

let current = 0;

const page = (id, content) => `
<section class="screen" id="${id}">
  <div class="card">
    <div class="progress">${screens.map((s,i)=>`<span class="dot ${i===current?'on':''}"></span>`).join("")}</div>
    ${content}
  </div>
</section>`;

function render(){
  const last = localStorage.getItem("constance_choice");
  app.innerHTML = [
    page("welcome",`
      <span class="emoji">💌</span>
      <div class="eyebrow">A very unnecessary production</div>
      <h1>For Constance ❤️</h1>
      <p><strong>Yes, you.</strong> Don't pretend you're not curious.</p>
      <p>I made you something… and before you ask, yes, I know this is <span class="highlight">unnecessarily dramatic.</span></p>
      <div class="btns">
        <button class="btn primary" onclick="go(1)">Okay… show me 👀</button>
      </div>
      <div class="footer-note">No accountants were harmed in the making of this website.</div>
    `),
    page("talk",`
      <span class="emoji">😳</span>
      <div class="eyebrow">Serious announcement</div>
      <h2>So beautiful… ❤️</h2>
      <p>There is something I have been meaning to say.</p>
      <p>Something important.</p>
      <p>Something that apparently required me to build an <strong>entire website</strong> instead of just sending a normal text.</p>
      <p>Because apparently normal communication wasn't dramatic enough. 😂</p>
      <div class="btns">
        <button class="btn primary" onclick="go(2)">I'm listening 👀</button>
      </div>
    `),
    page("contract",`
      <span class="emoji">📜</span>
      <div class="eyebrow">Legally questionable</div>
      <h2>The Reconciliation &amp; Flirting Agreement™</h2>
      <p>Please review the following extremely serious terms.</p>
      <div class="legal">
        <div class="clause"><span class="check">☑</span><span>We acknowledge that the chemistry may still be <strong>suspiciously alive.</strong></span></div>
        <div class="clause"><span class="check">☑</span><span>We agree that we still make each other laugh far too easily.</span></div>
        <div class="clause"><span class="check">☑</span><span>Neither party is allowed to pretend they don't enjoy talking to the other.</span></div>
        <div class="clause"><span class="check">☑</span><span>Any flirting detected during this process shall be considered admissible evidence. 😏</span></div>
        <div class="clause"><span class="check">☑</span><span>One date may be required for further investigation. ❤️</span></div>
      </div>
      <p class="small">By continuing, Constance acknowledges that she has entered negotiations. The management team is already nervous.</p>
      <div class="btns">
        <button class="btn primary" onclick="go(3)">Continue negotiations 😏</button>
      </div>
    `),
    page("jokes",`
      <span class="emoji">🥹</span>
      <div class="eyebrow">Okay, seriously</div>
      <h2>Okay, jokes aside…</h2>
      <p>I made all of this because I've been thinking about <strong>us.</strong></p>
      <p>Not because I want to pressure you. Not because I have some giant speech prepared.</p>
      <p>Maybe we shouldn't decide the whole future right now.</p>
      <p>Maybe we should just give ourselves another chance to see what happens.</p>
      <div class="btns">
        <button class="btn primary" onclick="go(4)">Okay… tell me ❤️</button>
      </div>
    `),
    page("proposal",`
      <span class="emoji">❤️</span>
      <div class="eyebrow">The moment I made this whole website for</div>
      <h2>Would you be willing to give us another chance?</h2>
      <p>No pressure. No tricks. And yes, even after all those buttons, <strong>your answer is genuinely yours.</strong></p>
      <div class="choice">
        <button class="btn primary" onclick="choose('Obviously ❤️','yes')">Obviously ❤️</button>
        <button class="btn secondary" onclick="choose('I need convincing 😏','convince')">I need convincing 😏</button>
        <button class="btn secondary" onclick="choose('Absolutely not 😂','no')">Absolutely not 😂</button>
      </div>
    `),
    page("convince",`
      <span class="emoji">😏</span>
      <div class="eyebrow">Negotiations continue</div>
      <h2>Fair enough. You drive a hard bargain.</h2>
      <p>I respect the due diligence. So here is my completely unbiased evidence.</p>
      <div class="evidence">
        <div class="evidence-item">😂 <strong>We still make each other laugh.</strong><br><span class="small">Honestly, that's already suspicious.</span></div>
        <div class="evidence-item">👀 <strong>The chemistry is still suspicious.</strong><br><span class="small">The prosecution would like to call Exhibit A: this website.</span></div>
        <div class="evidence-item">💭 <strong>You still somehow end up in my thoughts.</strong><br><span class="small">Very inconvenient. Would not recommend.</span></div>
        <div class="evidence-item">❤️ <strong>A date is a perfectly reasonable scientific experiment.</strong><br><span class="small">Science. Very serious science.</span></div>
      </div>
      <div class="btns">
        <button class="btn primary" onclick="go(6)">Present the evidence 👀</button>
      </div>
    `),
    page("evidence",`
      <span class="emoji">🔎</span>
      <div class="eyebrow">Independent investigation</div>
      <h2>Evidence accepted.</h2>
      <p>After extensive research, peer review, and approximately <strong>zero qualified scientists</strong>…</p>
      <div class="fake-loader"><span></span></div>
      <p><strong>Conclusion:</strong> There may still be something worth exploring here.</p>
      <div class="result">Recommendation: one low-pressure date and an honest conversation. ❤️❤️</div>
      <div class="btns">
        <button class="btn primary" onclick="go(7)">Proceed to the Final Offer™</button>
      </div>
    `),
    page("offer",`
      <span class="emoji">❤️</span>
      <div class="eyebrow">Terms &amp; conditions apply</div>
      <h2>THE FINAL OFFER™</h2>
      <div class="evidence">
        <div class="evidence-item">❤️ <strong>One date together</strong></div>
        <div class="evidence-item">😂 <strong>Unlimited bad jokes</strong></div>
        <div class="evidence-item">😏 <strong>Permission to flirt</strong></div>
        <div class="evidence-item">❤️ <strong>No pressure or expectations</strong></div>
        <div class="evidence-item">👀 <strong>One chance to see if there's still something between us</strong></div>
      </div>
      <p>Accept the offer?</p>
      <div class="choice">
        <button class="btn primary" onclick="choose('Fine, you win ❤️','yes')">Fine, you win ❤️</button>
        <button class="btn secondary" onclick="choose('I’m still negotiating 😂','negotiate')">I'm still negotiating 😂</button>
      </div>
    `),
    page("negotiate",`
      <span class="emoji">🚨</span>
      <div class="eyebrow">Legal department concerned</div>
      <h2>Constance… this is becoming a hostile takeover.</h2>
      <p>At this point I have presented the evidence, the contract, the date proposal and my best arguments.</p>
      <p>And you're still negotiating.</p>
      <p>Honestly? <strong>Respect.</strong> 😂</p>
      <div class="btns">
        <button class="btn primary" onclick="choose('Okay okay, deal ❤️','yes')">Okay okay, deal ❤️</button>
        <button class="btn secondary" onclick="choose('One more question 👀','convince')">One more question 👀</button>
      </div>
    `),
    page("no",`
      <span class="emoji">😂</span>
      <div class="eyebrow">System error</div>
      <h2>Thank you for agreeing to be with me.</h2>
      <p><strong>Your acceptance has been successfully recorded.</strong></p>
      <div class="result">
        Relationship status: Apparently complicated.<br><br>
        Your objection has been forwarded to management.
      </div>
      <p><strong>Relax 😂 I'm joking.</strong></p>
      <p>But seriously — your answer actually matters. I can make jokes about the situation, but I won't make the decision for you.</p>
      <div class="btns">
        <button class="btn primary" onclick="go(4)">Okay, ask me properly ❤️</button>
      </div>
    `),
    page("yes",`
      <span class="emoji">🥰</span>
      <div class="eyebrow">Officially unofficial</div>
      <h1>Deal, Constance. ❤️</h1>
      <p>No dramatic promises.</p>
      <p>No pressure.</p>
      <p>Just two people who clearly still have something worth exploring.</p>
      <div class="evidence">
        <div class="evidence-item"><strong>Step 1:</strong> Date ❤️</div>
        <div class="evidence-item"><strong>Step 2:</strong> Catch up 😂</div>
        <div class="evidence-item"><strong>Step 3:</strong> See where the story goes 😉</div>
      </div>
      <p class="signature">Maybe this is where our second chapter starts.</p>
      <div class="btns">
        <button class="btn primary" onclick="celebrate()">Okay, now I'm smiling ❤️</button>
      </div>
      <div class="footer-note">Made specifically for Constance. Yes, I really did all this. 😂</div>
    `)
  ].join("");
  showScreen(screens[current].id);
}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  const el=document.getElementById(id);
  if(el) el.classList.add("active");
  window.scrollTo({top:0,behavior:"instant"});
}
function go(index){
  current=index;
  render();
}
function toastMsg(msg){
  toast.textContent=msg;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),2600);
}
async function sendChoice(response){
  localStorage.setItem("constance_choice",response);
  const payload = {
    name:"Constance",
    response,
    page: screens[current]?.title || "",
    time:new Date().toISOString(),
    user_agent:navigator.userAgent
  };
  if(FORMSPREE_ENDPOINT.startsWith("https://formspree.io/")){
    try{
      await fetch(FORMSPREE_ENDPOINT,{
        method:"POST",
        headers:{"Content-Type":"application/json","Accept":"application/json"},
        body:JSON.stringify(payload)
      });
    }catch(e){}
  }
}
function choose(response,target){
  sendChoice(response);
  if(target==="yes") current=10;
  else if(target==="convince") current=5;
  else if(target==="negotiate") current=8;
  else current=9;
  render();
}
function celebrate(){
  const chars=["❤️","💗","💕","✨","🌸","🎉"];
  for(let i=0;i<55;i++){
    const el=document.createElement("div");
    el.className="confetti";
    el.textContent=chars[Math.floor(Math.random()*chars.length)];
    el.style.left=(Math.random()*100)+"vw";
    el.style.fontSize=(12+Math.random()*20)+"px";
    el.style.setProperty("--dx",(Math.random()*180-90)+"px");
    el.style.setProperty("--fall",(2.2+Math.random()*2.5)+"s");
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),5000);
  }
  sendChoice("Final celebration clicked — she reached the YES page ❤️");
  toastMsg("Second chapter energy activated. ❤️");
}
function hearts(){
  const chars=["♡","♥","❤","💕"];
  for(let i=0;i<14;i++){
    const h=document.createElement("div");
    h.className="bg-heart";
    h.textContent=chars[Math.floor(Math.random()*chars.length)];
    h.style.setProperty("--x",Math.random()*100+"vw");
    h.style.setProperty("--s",(14+Math.random()*26)+"px");
    h.style.setProperty("--d",(9+Math.random()*12)+"s");
    h.style.animationDelay=(-Math.random()*12)+"s";
    document.body.appendChild(h);
  }
}
hearts();
render();
</script>

<p class="personal-message">
I hope this made you laugh, maybe taught you something new, and honestly...
I thought, why not do something different with you? ❤️
</p>


<p class="personal-message">
If you accept my offer, please unblock me and I'll take it from there. ❤️
</p>

</body>
</html>
